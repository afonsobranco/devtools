<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07080D"/>
      <stop offset="100%" stop-color="#0D1220"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00CFFF"/>
      <stop offset="50%" stop-color="#6EE7FF"/>
      <stop offset="100%" stop-color="#00CFFF"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A0C8FF"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Subtle grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Glow blobs -->
  <ellipse cx="200" cy="200" rx="300" ry="200" fill="rgba(0,100,200,0.08)"/>
  <ellipse cx="1000" cy="450" rx="280" ry="180" fill="rgba(0,150,255,0.06)"/>
  <!-- Logo mark -->
  <g transform="translate(498,200)">
    <rect width="40" height="40" rx="10" fill="#00CFFF" opacity="0.15"/>
    <path d="M8 20L15 8L22 20L15 32L8 20Z" fill="#00CFFF" opacity="0.95"/>
    <path d="M16 20L23 8L30 20L23 32L16 20Z" fill="#00CFFF" opacity="0.38"/>
  </g>
  <!-- Title: Char -->
  <text x="280" y="355" font-family="Georgia, serif" font-weight="700" font-size="120" fill="url(#title)" letter-spacing="-4">Char</text>
  <!-- Separator -->
  <text x="640" y="350" font-family="monospace" font-size="60" fill="#00CFFF" opacity="0.55">◆</text>
  <!-- Title: Code -->
  <text x="712" y="355" font-family="monospace" font-weight="400" font-size="120" fill="url(#shimmer)" letter-spacing="-3">Code</text>
  <!-- Divider line -->
  <line x1="320" y1="380" x2="570" y2="380" stroke="rgba(0,207,255,0.3)" stroke-width="1"/>
  <circle cx="598" cy="380" r="4" fill="#00CFFF" opacity="0.7"/>
  <line x1="626" y1="380" x2="876" y2="380" stroke="rgba(0,207,255,0.3)" stroke-width="1"/>
  <!-- Subtitle -->
  <text x="598" y="416" font-family="monospace" font-size="18" fill="rgba(255,255,255,0.38)" text-anchor="middle" letter-spacing="3">UNICODE · HTML ENTITIES · UTF-8 · HEX · URL ENCODING</text>
  <!-- Domain -->
  <text x="598" y="580" font-family="monospace" font-size="16" fill="rgba(255,255,255,0.2)" text-anchor="middle" letter-spacing="2">afonsobranco.github.io/devtools</text>
</svg>
